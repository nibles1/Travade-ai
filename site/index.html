<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>travade.ai | The New Era of Travel</title>
<style>
  :root { --bg:#05070d; --accent:#4f8cff; --text:#e8edf7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  #intro { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2rem; transition: opacity 1s; }
  #intro.hidden { opacity: 0; pointer-events: none; }

  .orb { width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #bcd4ff, var(--accent) 45%, #0b1a3a 75%);
    box-shadow: 0 0 60px var(--accent); animation: pulse 2.4s ease-in-out infinite; }
  .orb.speaking { animation-duration: 0.9s; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.12); opacity: 1; } }

  .line { font-size: clamp(1.2rem, 3.5vw, 2rem); letter-spacing: .04em; min-height: 2.5rem;
    text-align: center; padding: 0 1rem; }
  .cursor::after { content: "|"; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  button { font: inherit; cursor: pointer; border-radius: 999px; padding: .8rem 2rem;
    background: transparent; color: var(--text); border: 1px solid var(--accent); }
  button:hover { background: var(--accent); }
  #skip { position: fixed; bottom: 1.5rem; right: 1.5rem; padding: .4rem 1rem; font-size: .85rem;
    border-color: #334; }
  #begin.hidden { display: none; }

  #site { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 1rem;
    opacity: 0; pointer-events: none; transition: opacity 1.2s; }
  #site.show { opacity: 1; pointer-events: auto; }
  #site h1 { font-size: clamp(2rem, 6vw, 3.5rem); }
  #site p { opacity: .75; }
</style>
</head>
<body>

<div id="intro">
  <div class="orb" id="orb"></div>
  <div class="line" id="line"></div>
  <button id="begin">Tap to begin</button>
</div>

<button id="skip">Skip</button>

<main id="site">
  <h1>travade.ai</h1>
  <p>Flights and tours, planned by AI. Confirmed by people.</p>
</main>

<script>
  const messages = [
    "Welcome to the new era of travel.",
    "Search. Compare. Book.",
    "Powered by AI, guided by people."
  ];
  const line = document.getElementById("line");
  const orb = document.getElementById("orb");
  const intro = document.getElementById("intro");
  const site = document.getElementById("site");
  const begin = document.getElementById("begin");
  const skip = document.getElementById("skip");
  let finished = false;

  function typeText(text, speed = 55) {
    return new Promise(resolve => {
      line.textContent = "";
      line.classList.add("cursor");
      let i = 0;
      const timer = setInterval(() => {
        line.textContent += text[i++];
        if (i >= text.length) {
          clearInterval(timer);
          line.classList.remove("cursor");
          setTimeout(resolve, 1000);
        }
      }, speed);
    });
  }

  function playTone(ctx) {
    // Soft generated chime, no external audio file needed
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(220, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 2.5);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 0.6);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 3);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 3);
  }

  async function runIntro(withSound) {
    if (withSound) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      playTone(ctx);
    }
    orb.classList.add("speaking");
    for (const msg of messages) {
      await typeText(msg);
    }
    endIntro();
  }

  function endIntro() {
    if (finished) return;
    finished = true;
    intro.classList.add("hidden");
    skip.style.display = "none";
    site.classList.add("show");
  }

  begin.addEventListener("click", () => {
    begin.classList.add("hidden");
    runIntro(true);
  });

  skip.addEventListener("click", endIntro);
</script>
</body>
</html>
