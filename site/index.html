<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRAVADE.AI | A New Era of Travel</title>
<style>
  :root { --bg:#04060c; --accent:#4f8cff; --glow:#7fb0ff; --text:#e8edf7; --muted:#9aa6bf; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  #c { position: fixed; inset: 0; width: 100%; height: 100%; }

  #enter { position: fixed; left: 50%; bottom: 24%; transform: translateX(-50%); z-index: 2;
    font: inherit; font-size: .85rem; letter-spacing: .35em; padding: .9rem 2.6rem;
    border-radius: 999px; background: rgba(79,140,255,.08); color: var(--text);
    border: 1px solid var(--accent); cursor: pointer; transition: background .3s, box-shadow .3s, opacity .6s; }
  #enter:hover { background: var(--accent); box-shadow: 0 0 24px rgba(79,140,255,.5); }
  #enter.hidden { opacity: 0; pointer-events: none; }

  #text { position: fixed; left: 0; right: 0; bottom: 12%; text-align: center; z-index: 2; pointer-events: none; }
  #title { font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 300; letter-spacing: .35em;
    text-transform: uppercase; opacity: 0; transform: translateY(16px);
    transition: opacity 1.6s ease, transform 1.6s ease; text-shadow: 0 0 30px rgba(127,176,255,.6); }
  #tag { margin-top: 1.2rem; font-size: clamp(.8rem, 2vw, 1.1rem); letter-spacing: .3em;
    text-transform: uppercase; color: var(--muted); opacity: 0; transition: opacity 1.6s ease .9s; }
  #text.show #title, #text.show #tag { opacity: 1; transform: none; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<button id="enter">ENTER</button>
<div id="text">
  <div id="title">Travade.ai</div>
  <div id="tag">A new era of travel coming soon</div>
</div>

<script>
(() => {
  const cv = document.getElementById("c"), cx = cv.getContext("2d");
  const enterBtn = document.getElementById("enter");
  const textBox = document.getElementById("text");

  const N = 260;
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const ASSEMBLE_TIME = 3.2;   // seconds for particles to form the orb
  const sphere = Array.from({ length: N }, (_, i) => {
    const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), th = i * GOLDEN;
    return { x: Math.cos(th) * r, y, z: Math.sin(th) * r };
  });

  let W = 0, H = 0, particles = [], started = false, startTime = 0, textShown = false;
  let ctx = null, master = null, lastPhase = 0;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const bump = (x, c, w) => Math.exp(-(((x - c) / w) ** 2));
  // Heartbeat: a "lub" and a softer "dub" per cycle (1.1s)
  const beatPhase = t => (t % 1.1) / 1.1;
  const beatAmp = t => { const ph = beatPhase(t); return bump(ph, .06, .07) + .6 * bump(ph, .24, .08); };

  /* ---------- Canvas setup ---------- */
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!particles.length) {
      particles = sphere.map((_, i) => ({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4,
        r: Math.random() * 1.4 + .8, delay: Math.random() * .9,
        sx: 0, sy: 0
      }));
    }
  }

  /* ---------- Sound: space pad, shimmer, hall reverb, heart thump ---------- */
  function makeHall(seconds = 6, decay = 2) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return ir;
  }

  function startAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(.07, ctx.currentTime + 4);

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass"; filter.frequency.value = 500; filter.Q.value = 6;
    filter.connect(master);

    const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.frequency.value = .08; lfoG.gain.value = 350;
    lfo.connect(lfoG).connect(filter.frequency); lfo.start();

    [55, 55.4, 82.4, 110.2].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = i % 2 ? "sawtooth" : "triangle";
      o.frequency.value = f; o.detune.value = (i - 1.5) * 8;
      g.gain.value = .35;
      o.connect(g).connect(filter); o.start();
    });

    const verb = ctx.createConvolver();
    verb.buffer = makeHall(6, 2);
    const wet = ctx.createGain(); wet.gain.value = .6;
    filter.connect(verb).connect(wet).connect(master);

    const shimmer = () => {
      if (!ctx) return;
      const notes = [880, 1174.7, 1318.5, 1760];
      const f = notes[Math.floor(Math.random() * notes.length)];
      const o = ctx.createOscillator(), g = ctx.createGain();
      const t = ctx.currentTime;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.05, t + 1.2);
      g.gain.exponentialRampToValueAtTime(.001, t + 4);
      o.connect(g); g.connect(master); g.connect(verb);
      o.start(t); o.stop(t + 4.1);
      setTimeout(shimmer, 2500 + Math.random() * 3000);
    };
    shimmer();
  }

  function thump() {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t = ctx.currentTime;
    o.type = "sine";
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(40, t + .3);
    g.gain.setValueAtTime(.5, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .35);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + .4);
  }

  /* ---------- Start sequence (on ENTER) ---------- */
  function start() {
    if (started) return;
    started = true;
    enterBtn.classList.add("hidden");
    particles.forEach(p => { p.sx = p.x; p.sy = p.y; }); // remember scattered positions
    startTime = performance.now();
    startAudio();
  }

  enterBtn.addEventListener("click", start);
  window.addEventListener("keydown", e => { if (e.key === "Enter") start(); });

  /* ---------- Animation loop ---------- */
  function frame(now) {
    cx.clearRect(0, 0, W, H);
    const elapsed = started ? (now - startTime) / 1000 : 0;
    const cxC = W / 2, cyC = H * .42, R = Math.min(W, H) * .16;

    const mix = started ? clamp((elapsed - ASSEMBLE_TIME + .6) / 1, 0, 1) : 0;
    const beat = started ? beatAmp(elapsed) * mix : 0;
    const scale = 1 + .1 * beat;

    // Heart thump, once per beat cycle
    if (mix > .9) {
      const ph = beatPhase(elapsed);
      if (ph < lastPhase) thump();
      lastPhase = ph;
    }

    // Soft glow behind the orb once it forms
    if (mix > 0) {
      const g = cx.createRadialGradient(cxC, cyC, R * .2, cxC, cyC, R * 1.8 * scale);
      g.addColorStop(0, `rgba(127,176,255,${.18 * mix + .08 * beat * mix})`);
      g.addColorStop(1, "rgba(127,176,255,0)");
      cx.fillStyle = g;
      cx.beginPath(); cx.arc(cxC, cyC, R * 1.8 * scale, 0, Math.PI * 2); cx.fill();
    }

    const ang = elapsed * .35, sa = Math.sin(ang), ca = Math.cos(ang);

    particles.forEach((p, i) => {
      let px, py, alpha, size = p.r;

      if (!started) {
        // Scattered drift
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        px = p.x; py = p.y; alpha = .55;
      } else {
        // Assemble into the rotating, beating orb
        const prog = clamp((elapsed - p.delay) / 2.4, 0, 1);
        const e = ease(prog);
        const s = sphere[i];
        const X = s.x * ca + s.z * sa;
        const Z = -s.x * sa + s.z * ca;
        const tx = cxC + X * R * scale;
        const ty = cyC + s.y * R * scale;
        px = p.sx + (tx - p.sx) * e;
        py = p.sy + (ty - p.sy) * e;
        const depth = (Z + 1) / 2;
        alpha = (.3 + .7 * depth) * (.4 + .6 * e);
        size = p.r * (.7 + .6 * depth);
      }

      cx.fillStyle = `rgba(127,176,255,${alpha})`;
      cx.beginPath(); cx.arc(px, py, size, 0, Math.PI * 2); cx.fill();
    });

    // Reveal the text once the orb has formed
    if (started && !textShown && elapsed > ASSEMBLE_TIME + 1.5) {
      textShown = true;
      textBox.classList.add("show");
    }

    requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
