<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRAVADE.AI | A New Era of Travel</title>
<style>
  :root { --bg:#04060c; --accent:#4f8cff; --glow:#7fb0ff; --text:#e8edf7; --muted:#9aa6bf; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  #bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }

  .city { position: absolute; opacity: 0; white-space: nowrap; text-transform: uppercase;
    color: var(--muted); letter-spacing: .14em; pointer-events: none; }

  #enter { position: fixed; left: 50%; bottom: 24%; transform: translateX(-50%); z-index: 2;
    font: inherit; font-size: .85rem; letter-spacing: .35em; padding: .9rem 2.6rem;
    border-radius: 999px; background: rgba(79,140,255,.08); color: var(--text);
    border: 1px solid var(--accent); cursor: pointer; transition: background .3s, box-shadow .3s, opacity .6s; }
  #enter:hover { background: var(--accent); box-shadow: 0 0 24px rgba(79,140,255,.5); }
  #enter.hidden { opacity: 0; pointer-events: none; }

  #text { position: fixed; left: 0; right: 0; bottom: 12%; text-align: center; z-index: 2; pointer-events: none; }
  #title { font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 300; letter-spacing: .35em;
    text-transform: uppercase; opacity: 0; transform: translateY(16px);
    transition: opacity 1.6s ease, transform 1.6s ease; text-shadow: 0 0 30px rgba(127,176,255,.6); }
  #tag { margin-top: 1.2rem; font-size: clamp(.8rem, 2vw, 1.1rem); letter-spacing: .3em;
    text-transform: uppercase; color: var(--muted); opacity: 0; transition: opacity 1.6s ease .9s; }
  #text.show #title, #text.show #tag { opacity: 1; transform: none; }
</style>
</head>
<body>

<div id="bgfx"></div>
<canvas id="c"></canvas>
<button id="enter">ENTER</button>
<div id="text">
  <div id="title">Travade.ai</div>
  <div id="tag">A new era of travel coming soon</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $("c"), cx = cv.getContext("2d");
  const bgfx = $("bgfx"), enterBtn = $("enter"), textBox = $("text");
  const titleEl = $("title"), tagEl = $("tag");
  const D = Math.PI / 180;

  /* ---------- Content ---------- */
  const CITIES = [
    "Paris", "東京 Tokyo", "دبي Dubai", "São Paulo", "Istanbul", "Mumbai", "北京 Beijing",
    "Roma", "Sydney", "New York", "Lagos", "London", "Bangkok", "Москва", "서울 Seoul", "Nairobi",
    "القاهرة Cairo", "Rio de Janeiro", "Mexico City", "Singapore", "Buenos Aires", "Reykjavík",
    "Marrakech", "Kyoto", "Cape Town", "Lima", "Hanoi", "Berlin", "Madrid", "Havana",
    "Barcelona", "Amsterdam", "Vienna", "Prague", "Lisbon", "Athens", "Edinburgh", "Dublin",
    "Oslo", "Stockholm", "Helsinki", "Copenhagen", "Zurich", "Munich", "Budapest", "Warsaw",
    "Florence", "Venice", "Santorini", "Dubrovnik", "Seville", "Porto", "Krakow", "Tallinn",
    "Delhi", "Kathmandu", "Colombo", "Kuala Lumpur", "Bali", "Manila", "Ho Chi Minh", "Taipei",
    "Hong Kong", "Shanghai", "Osaka", "Seoul", "Chennai", "Doha", "Abu Dhabi", "Muscat",
    "Tehran", "Jeddah", "Tel Aviv", "Amman", "Beirut", "Addis Ababa", "Accra", "Dakar",
    "Casablanca", "Tunis", "Johannesburg", "Cairo", "Zanzibar", "Mauritius", "Maldives", "Seychelles",
    "Los Angeles", "San Francisco", "Chicago", "Miami", "Las Vegas", "Toronto", "Vancouver", "Montreal",
    "Cancún", "Bogotá", "Santiago", "Quito", "Cusco", "Montevideo", "Caracas", "Panama City",
    "Honolulu", "Auckland", "Melbourne", "Fiji", "Tahiti", "Queenstown", "Perth", "Brisbane"
  ];

  const FONTS = ["Georgia, serif", "'Courier New', monospace", "'Brush Script MT', cursive",
    "Impact, sans-serif", "'Palatino Linotype', serif", "'Trebuchet MS', sans-serif",
    "'Lucida Console', monospace", "'Segoe Script', cursive", "'Gill Sans', sans-serif",
    "'Garamond', serif", "'Verdana', sans-serif", "'Century Gothic', sans-serif"];

  /* ---------- Coarse continent outlines, [lon, lat, lon, lat, ...] ---------- */
  const LAND = [
    [-168,66,-162,70,-140,70,-120,72,-95,73,-80,70,-62,60,-55,50,-66,44,-76,38,-81,31,-80,25,-82,28,-90,30,-97,27,-97,22,-88,21,-83,15,-78,8,-86,12,-95,16,-105,20,-110,24,-115,30,-120,34,-124,40,-124,48,-130,55,-140,60,-152,59,-165,62],
    [-55,60,-44,60,-20,70,-20,82,-40,83,-60,80,-70,77,-55,70],
    [-120,72,-95,73,-80,73,-70,80,-90,82,-120,78],
    [-80,10,-72,12,-62,11,-52,5,-50,0,-40,-3,-35,-7,-39,-15,-41,-22,-48,-26,-53,-34,-58,-38,-62,-40,-65,-45,-68,-52,-72,-54,-75,-48,-73,-38,-71,-30,-70,-18,-76,-14,-81,-5,-80,0,-78,8],
    [-9,43,-1,46,-4,48,2,51,8,54,9,57,14,54,20,55,22,59,30,60,30,70,40,68,60,69,70,73,80,73,100,78,115,74,140,72,160,70,180,68,180,65,170,60,162,58,156,51,142,59,135,55,140,48,132,43,128,38,126,35,122,40,118,38,120,28,110,21,106,17,109,12,105,9,100,13,100,5,104,1,98,8,98,16,94,17,92,22,88,22,80,15,77,8,72,21,67,24,57,26,56,27,50,30,48,30,52,24,56,25,59,22,52,16,44,13,43,16,35,28,34,30,35,36,27,37,26,40,23,38,20,40,19,42,13,45,12,44,18,40,16,38,12,42,9,44,3,43,-1,37,-5,36,-9,37],
    [5,58,5,62,14,68,24,71,30,70,28,65,22,64,18,60,16,56,12,56,10,59,7,58],
    [-17,21,-16,28,-10,30,-6,36,10,37,11,33,20,31,32,31,34,28,38,20,43,12,51,12,44,6,40,-3,39,-10,41,-16,35,-24,32,-29,27,-34,20,-35,18,-32,12,-18,14,-10,12,-5,9,4,5,6,-4,5,-8,4,-13,8,-17,14],
    [44,-25,47,-25,50,-15,49,-12,44,-17],
    [114,-22,114,-34,118,-35,131,-31,138,-35,141,-38,150,-37,153,-28,153,-25,146,-19,142,-11,141,-17,136,-12,130,-11,126,-14,122,-18],
    [172,-34,178,-38,175,-41,173,-40],
    [172,-41,174,-41,168,-47,166,-46],
    [-5,50,1,51,2,53,-2,56,-3,58,-6,58,-5,55,-10,52,-6,52],
    [-24,65,-14,66,-14,64,-22,63],
    [130,31,135,34,140,35,142,40,141,41,139,38,136,37,131,34],
    [140,42,145,43,142,45],
    [95,5,106,-6,104,-5,96,0],
    [105,-6,114,-8,106,-7],
    [109,1,117,7,119,1,116,-4,110,-3],
    [131,-1,141,-3,150,-10,141,-9,137,-5],
    [120,18,122,18,126,8,122,7,120,14],
    [-85,22,-74,20,-77,20,-82,23],
    [80,10,82,7,80,6],
    [120,22,122,25,121,25,120,23]
  ];

  /* ---------- Helpers ---------- */
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const bump = (x, c, w) => Math.exp(-(((x - c) / w) ** 2));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const rectOf = el => { const r = el.getBoundingClientRect(); return { x1: r.left, y1: r.top, x2: r.right, y2: r.bottom }; };
  const hit = (a, b, pad = 12) => !(a.x2 + pad < b.x1 || b.x2 + pad < a.x1 || a.y2 + pad < b.y1 || b.y2 + pad < a.y1);

  /* ---------- Geography ---------- */
  function inPoly(lon, lat, p) {
    let inside = false;
    for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
      const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
      if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  const isLand = (lon, lat) => LAND.some(p => inPoly(lon, lat, p));
  const toVec = (lat, lon) => {
    const a = lat * D, b = lon * D, ca = Math.cos(a);
    return { x: ca * Math.sin(b), y: Math.sin(a), z: ca * Math.cos(b) };
  };
  const fromVec = v => ({ lat: Math.asin(clamp(v.y, -1, 1)) / D, lon: Math.atan2(v.x, v.z) / D });

  // Land sample grid, used to move water dots onto the nearest coastline
  const landGrid = [];
  for (let lat = -70; lat <= 80; lat += 4)
    for (let lon = -180; lon < 180; lon += 4)
      if (isLand(lon + 2, lat + 2)) landGrid.push(toVec(lat + 2, lon + 2));

  function nearestLand(v) {
    let best = landGrid[0], bd = -2;
    for (const g of landGrid) {
      const d = g.x * v.x + g.y * v.y + g.z * v.z;
      if (d > bd) { bd = d; best = g; }
    }
    return best;
  }

  /* ---------- Constants ---------- */
  const N = 3600, GOLD = Math.PI * (3 - Math.sqrt(5));
  const SHOW_OCEAN = true;   // false = glow-only globe
  const OCEAN_ALPHA = .18;   // strength of the ocean dot texture
  const PHASE = rnd(0, Math.PI * 2);          // random start angle each visit
  const TILT = rnd(.15, .35);                 // slight axial tilt
  const SPIN = .1;                            // rotation speed, eastward like Earth
  const ASSEM_DUR = 2.8;                      // scattered dots gather into the sphere
  const MORPH_START = 4.8, MORPH_DUR = 3.6;   // sphere morphs into the map
  const ROUTE_START = 10;
  const TEXT_AT = 11;
  const BEAT_PERIOD = 2.6, BEAT_DELAY = 12.5;
  const FADE_OUT = 2;                         // seconds for a route's red line to fade after arrival

  /* ---------- Particles ---------- */
  const particles = [], landIdx = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), th = i * GOLD + rnd(-.05, .05);
    const s = { x: Math.cos(th) * r, y, z: Math.sin(th) * r };
    const ll = fromVec(s);
    const land = isLand(ll.lon, ll.lat);
    if (land) landIdx.push(i);
    particles.push({
      s, m: land ? s : nearestLand(s), land,
      x: rnd(0, innerWidth), y: rnd(0, innerHeight),
      vx: rnd(-.2, .2), vy: rnd(-.2, .2),
      r: land ? rnd(1.0, 1.8) : rnd(.35, .7),
      delay: rnd(0, 1.2), mdelay: rnd(0, 1.2), sx: 0, sy: 0
    });
  }
  const heat = new Float32Array(N);

  /* ---------- State ---------- */
  let W = 0, H = 0, cxC = 0, cyC = 0, R = 0, curScale = 1;
  let started = false, startTime = 0, textShown = false;
  let ctx = null, master = null, lastBeat = -1;
  let routes = [], lastSpawn = -99, nextGap = 1.5;
  let lastNow = performance.now();
  const activeEls = new Set();

  /* ---------- Layout ---------- */
  function layout() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cxC = W / 2; cyC = H * .42; R = Math.min(W, H) * .18;
  }

  /* ---------- City names ---------- */
  function findSpot(el) {
    const w = el.offsetWidth, h = el.offsetHeight;
    const blocks = [
      { x1: cxC - R * 1.5, y1: cyC - R * 1.5, x2: cxC + R * 1.5, y2: cyC + R * 1.5 },
      rectOf(titleEl), rectOf(tagEl), rectOf(enterBtn)
    ];
    activeEls.forEach(e => blocks.push(rectOf(e)));
    for (let k = 0; k < 60; k++) {
      const x = rnd(10, W - w - 10), y = rnd(10, H - h - 10);
      const r = { x1: x, y1: y, x2: x + w, y2: y + h };
      if (!blocks.some(b => hit(r, b))) return { x, y };
    }
    return null;
  }

  function spawnCity() {
    const el = document.createElement("div");
    el.className = "city";
    el.textContent = pick(CITIES);
    el.style.fontFamily = pick(FONTS);
    el.style.fontSize = rnd(14, 28) + "px";
    el.style.fontStyle = Math.random() < .2 ? "italic" : "normal";
    bgfx.appendChild(el);
    const spot = findSpot(el);
    if (!spot) { el.remove(); return; }
    el.style.left = spot.x + "px";
    el.style.top = spot.y + "px";
    activeEls.add(el);
    const anim = el.animate(
      [{ opacity: 0 }, { opacity: .4, offset: .5 }, { opacity: 0 }],
      { duration: 7000, easing: "ease-in-out" }
    );
    anim.onfinish = () => { activeEls.delete(el); el.remove(); };
  }

  function labelLoop() {
    if (activeEls.size < 4) spawnCity();
    setTimeout(labelLoop, rnd(1600, 2600));
  }

  /* ---------- Sound ---------- */
  function makeHall(seconds = 6, decay = 2) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return ir;
  }

  function startAudio() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(.07, ctx.currentTime + 4);

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass"; filter.frequency.value = 500; filter.Q.value = 6;
    filter.connect(master);

    const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
    lfo.frequency.value = .08; lfoG.gain.value = 350;
    lfo.connect(lfoG).connect(filter.frequency); lfo.start();

    [55, 55.4, 82.4, 110.2].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = i % 2 ? "sawtooth" : "triangle";
      o.frequency.value = f; o.detune.value = (i - 1.5) * 8;
      g.gain.value = .35;
      o.connect(g).connect(filter); o.start();
    });

    const verb = ctx.createConvolver();
    verb.buffer = makeHall(6, 2);
    const wet = ctx.createGain(); wet.gain.value = .6;
    filter.connect(verb).connect(wet).connect(master);

    const shimmer = () => {
      if (!ctx) return;
      const notes = [880, 1174.7, 1318.5, 1760];
      const o = ctx.createOscillator(), g = ctx.createGain();
      const t = ctx.currentTime;
      o.type = "sine"; o.frequency.value = pick(notes);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.05, t + 1.2);
      g.gain.exponentialRampToValueAtTime(.001, t + 4);
      o.connect(g); g.connect(master); g.connect(verb);
      o.start(t); o.stop(t + 4.1);
      setTimeout(shimmer, 2500 + Math.random() * 3000);
    };
    shimmer();
  }

  function thump() {
    if (!ctx) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(70, t);
    o.frequency.exponentialRampToValueAtTime(35, t + .45);
    g.gain.setValueAtTime(.35, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .6);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + .65);
  }

  /* ---------- 3D math ---------- */
  // Point on the sphere for particle p at morph amount m (0 = orb, 1 = map)
  function uvAt(p, m) {
    if (m <= 0) return p.s;
    if (m >= 1) return p.m;
    const x = p.s.x + (p.m.x - p.s.x) * m, y = p.s.y + (p.m.y - p.s.y) * m, z = p.s.z + (p.m.z - p.s.z) * m;
    const L = Math.hypot(x, y, z) || 1;
    return { x: x / L, y: y / L, z: z / L };
  }

  // Rotate with the Earth's spin, then apply a slight tilt
  function spin(v, t) {
    const a = t * SPIN + PHASE, sa = Math.sin(a), ca = Math.cos(a);
    const X = v.x * ca + v.z * sa, Z0 = -v.x * sa + v.z * ca;
    const sb = Math.sin(TILT), cb = Math.cos(TILT);
    return { X, Y: v.y * cb - Z0 * sb, Z: v.y * sb + Z0 * cb };
  }

  function proj(v, t) {
    const p = spin(v, t);
    return { x: cxC + p.X * R * curScale, y: cyC - p.Y * R * curScale, d: (p.Z + 1) / 2, Z: p.Z };
  }

  /* ---------- Routes (between land points only) ---------- */
  function pickLand(t) {
    for (let k = 0; k < 300; k++) {
      const i = landIdx[Math.floor(Math.random() * landIdx.length)];
      const p = spin(particles[i].s, t);
      const frontW = .15 + .85 * ((p.Z + 1) / 2);
      const poleDamp = 1 - .5 * p.Y * p.Y;
      if (Math.random() < frontW * poleDamp) return i;
    }
    return landIdx[Math.floor(Math.random() * landIdx.length)];
  }

  function spawnRoute(t) {
    const busy = new Set();
    routes.forEach(r => { busy.add(r.ia); busy.add(r.ib); });
    for (let k = 0; k < 40; k++) {
      const ia = pickLand(t), ib = pickLand(t);
      if (ia === ib || busy.has(ia) || busy.has(ib)) continue;
      const A = spin(particles[ia].s, t), B = spin(particles[ib].s, t);
      const dot = clamp(A.X * B.X + A.Y * B.Y + A.Z * B.Z, -1, 1);
      if (dot > .6 || dot < -.85) continue;
      if (A.Z < -.1 || B.Z < -.1) continue;
      routes.push({ ia, ib, start: t, dur: 3 + Math.acos(dot) * 1.2, arrived: false });
      heat[ia] = 1;
      return;
    }
  }

  // Point along the great-circle arc from A to B, bowed slightly outward
  function arcAt(A, B, u) {
    const dot = clamp(A.X * B.X + A.Y * B.Y + A.Z * B.Z, -1, 1);
    const w = Math.acos(dot), sw = Math.sin(w);
    let X, Y, Z;
    if (sw < 1e-4) {
      X = A.X + (B.X - A.X) * u; Y = A.Y + (B.Y - A.Y) * u; Z = A.Z + (B.Z - A.Z) * u;
    } else {
      const a = Math.sin((1 - u) * w) / sw, b = Math.sin(u * w) / sw;
      X = a * A.X + b * B.X; Y = a * A.Y + b * B.Y; Z = a * A.Z + b * B.Z;
    }
    const lift = 1 + .14 * Math.sin(Math.PI * u);
    return { x: cxC + X * lift * R * curScale, y: cyC - Y * lift * R * curScale, z: Z };
  }

  // Draws one route: dim maroon full arc, red traveled part, red dot at the front.
  // After arrival the red part fades over FADE_OUT seconds, then the route is removed.
  function drawRoutes(elapsed) {
    routes = routes.filter(r => elapsed - r.start < r.dur + FADE_OUT);
    for (const r of routes) {
      const A = spin(particles[r.ia].s, elapsed), B = spin(particles[r.ib].s, elapsed);
      const t = clamp((elapsed - r.start) / r.dur, 0, 1), e = ease(t);
      const fade = clamp(1 - (elapsed - (r.start + r.dur)) / FADE_OUT, 0, 1);
      const seg = 56;

      // Dim maroon arc showing the full route
      cx.beginPath();
      for (let s = 0; s <= seg; s++) {
        const p = arcAt(A, B, s / seg);
        s ? cx.lineTo(p.x, p.y) : cx.moveTo(p.x, p.y);
      }
      cx.strokeStyle = `rgba(120,28,38,${.4 * fade})`;
      cx.lineWidth = 1;
      cx.stroke();

      if (e > 0) {
        // Red line from the start up to the moving dot (distance travelled)
        cx.beginPath();
        for (let s = 0; s <= seg; s++) {
          const p = arcAt(A, B, e * s / seg);
          s ? cx.lineTo(p.x, p.y) : cx.moveTo(p.x, p.y);
        }
        cx.strokeStyle = `rgba(255,60,60,${.9 * fade})`;
        cx.lineWidth = 1.4;
        cx.stroke();

        // Moving red dot
        if (t < 1) {
          const h = arcAt(A, B, e);
          cx.save();
          cx.fillStyle = "#ff3b3b";
          cx.shadowColor = "#ff3b3b"; cx.shadowBlur = 10;
          cx.beginPath(); cx.arc(h.x, h.y, 2.6, 0, Math.PI * 2); cx.fill();
          cx.restore();
        }
      }

      if (t >= 1 && !r.arrived) { r.arrived = true; heat[r.ib] = 1; }
    }
  }

  /* ---------- Start ---------- */
  function start() {
    if (started) return;
    started = true;
    enterBtn.classList.add("hidden");
    particles.forEach(p => { p.sx = p.x; p.sy = p.y; });
    startTime = performance.now();
    startAudio();
  }
  enterBtn.addEventListener("click", start);
  window.addEventListener("keydown", e => { if (e.key === "Enter") start(); });

  /* ---------- Main loop ---------- */
  function frame(now) {
    const dt = Math.min(.05, (now - lastNow) / 1000); lastNow = now;
    cx.clearRect(0, 0, W, H);

    const elapsed = started ? (now - startTime) / 1000 : 0;
    const mix = started ? clamp((elapsed - 3.4) / 1, 0, 1) : 0;

    // Slow, delayed heartbeat (starts once the map has formed)
    const beatMix = started ? clamp((elapsed - BEAT_DELAY) / 3, 0, 1) : 0;
    const beatT = Math.max(0, elapsed - BEAT_DELAY);
    const ph = (beatT % BEAT_PERIOD) / BEAT_PERIOD;
    const beat = beatMix * (bump(ph, .1, .09) + .55 * bump(ph, .3, .1));
    curScale = 1 + .04 * beat;
    if (started && beatMix > .5) {
      const bi = Math.floor(beatT / BEAT_PERIOD);
      if (bi !== lastBeat) { lastBeat = bi; thump(); }
    }

    // Backlit rim glow: light spilling out from behind the globe
    if (mix > 0) {
      const rr = R * curScale;
      cx.save();
      cx.beginPath();
      cx.arc(cxC, cyC, rr * 1.5, 0, Math.PI * 2);
      cx.arc(cxC, cyC, rr * .98, 0, Math.PI * 2, true);
      cx.clip();
      const g = cx.createRadialGradient(cxC, cyC, rr * .98, cxC, cyC, rr * 1.5);
      g.addColorStop(0, `rgba(127,176,255,${.5 * mix + .1 * beat})`);
      g.addColorStop(.3, `rgba(127,176,255,${.2 * mix})`);
      g.addColorStop(1, "rgba(127,176,255,0)");
      cx.fillStyle = g;
      cx.fillRect(0, 0, W, H);
      cx.restore();
    }

    // Routes
    if (started && elapsed > ROUTE_START && routes.length < 4 && elapsed - lastSpawn > nextGap) {
      spawnRoute(elapsed);
      lastSpawn = elapsed;
      nextGap = rnd(1.8, 3.2);
    }
    drawRoutes(elapsed);

    for (let i = 0; i < N; i++) heat[i] *= Math.exp(-dt / 1.6);

    // Dots
    for (let i = 0; i < N; i++) {
      const p = particles[i];
      let px, py, alpha, size;
      if (!started) {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        px = p.x; py = p.y; alpha = .55; size = p.r;
      } else {
        const ae = ease(clamp((elapsed - p.delay) / ASSEM_DUR, 0, 1));
        const mp = ease(clamp((elapsed - MORPH_START - p.mdelay) / MORPH_DUR, 0, 1));
        const P = proj(uvAt(p, mp), elapsed);
        px = p.sx + (P.x - p.sx) * ae;
        py = p.sy + (P.y - p.sy) * ae;
        const base = (.3 + .7 * P.d) * (.4 + .6 * ae);
        alpha = p.land ? base + (.92 - base) * mp
                       : (SHOW_OCEAN ? base + (OCEAN_ALPHA - base) * mp : base * (1 - mp));
        size = p.r * (.7 + .6 * P.d);
      }
      const h = heat[i];
      const r = Math.round(127 + 128 * h), g = Math.round(176 - 106 * h), b = Math.round(255 - 185 * h);
      cx.fillStyle = `rgba(${r},${g},${b},${clamp(alpha, 0, 1)})`;
      cx.beginPath(); cx.arc(px, py, size * (1 + .8 * h), 0, Math.PI * 2); cx.fill();
    }

    if (started && !textShown && elapsed > TEXT_AT) {
      textShown = true;
      textBox.classList.add("show");
    }

    requestAnimationFrame(frame);
  }

  addEventListener("resize", layout);
  layout();
  labelLoop();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
